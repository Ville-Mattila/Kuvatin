[package]
name = "kuvatin-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Installs a staged Kuvatin update once Kuvatin has closed, and starts it again"
publish = false

[[bin]]
name = "kuvatin-updater"
path = "src/main.rs"

# Windows and nothing else. This program runs from the staging folder with
# only the installer beside it, so every dependency it grows is a library it
# would then have to find there.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
