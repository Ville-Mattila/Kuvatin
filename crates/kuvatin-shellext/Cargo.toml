[package]
name = "kuvatin-shellext"
description = "Windows 11 File Explorer context-menu handler for Kuvatin (IExplorerCommand, loaded by the shell through the sparse package)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kuvatin-core = { path = "../kuvatin-core" }
windows-core = "0.58"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
