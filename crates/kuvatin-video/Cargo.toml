[package]
name = "kuvatin-video"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "GStreamer Editing Services-backed video engine for Kuvatin: layered timeline, composited preview, hardware export, image-sequence rendering"

[dependencies]
gstreamer = "0.25"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
# v1_20 enables set_element_properties (per-encoder bitrate) on EncodingProfile.
gstreamer-pbutils = { version = "0.23", features = ["v1_20"] }
# v1_20 enables GESVideoSource::natural_size (aspect-correct scaling); v1_24
# the discoverer manager, whose timeout keeps an unreachable file from wedging
# an import forever. The bundled SDK is 1.26, so both are present.
gstreamer-editing-services = { version = "0.23", features = ["v1_20", "v1_24"] }
anyhow = { workspace = true }
# The saved project format (document.rs): the same pair the presets use.
serde = { workspace = true }
toml = { workspace = true }
# EXR sequence support: GStreamer's Windows binaries ship no OpenEXR plugin, so
# .exr frames are decoded in Rust (and tonemapped to sRGB PNG) before import.
image = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = "3"
