name: release

# Build + test on every push to master; build, install-test and publish the
# Windows .msi on a version tag (v2.0.0 — attached to the GitHub Release) or on
# manual dispatch (uploaded as a workflow artifact).
#
# Why master runs exist: GitHub's Actions cache is scoped by git ref — a run can
# only restore caches saved on its own ref or on the default branch. With
# tag-only runs, every release started from a cold cache and recompiled all
# ~400 dependency crates (11+ minutes). Master runs save the dependency cache
# on the default branch, tag runs restore it, and cargo's fingerprinting then
# rebuilds only the workspace crates (and any dependency that actually changed).
# Only master runs save (a tag-scoped cache is dead weight: nothing can read it).
#
# Hardening: third-party downloads (GStreamer MSIs, WiX zip) are pinned by
# SHA-256 and the build fails on mismatch — they are executed and their DLLs are
# harvested into the shipped installer, so an upstream/CDN compromise must not
# flow through. Actions are pinned to commit SHAs. The toolchain is pinned by
# rust-toolchain.toml. The workflow runs with read-only repository access; only
# the final publish job (tags) may write, and it only ever uploads assets.
#
# Gates, in order: fmt, clippy (-D warnings), cargo-deny (licenses +
# advisories), the deterministic suites (core + gui), the self-contained video
# suite (generated frames, real GStreamer pipelines), and a headless smoke
# render with the release exe. A tag additionally installs the built MSI and
# converts an image + renders a sequence with the INSTALLED copy (bundled
# runtime only), so a plugin missing from the bundle fails here, not on a
# user's machine. The live-media video tests (fixture webm) stay advisory —
# asset-URI resolution has been flaky on the hosted runner.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  # Pull requests (Dependabot's included) get the same gates; the workflow
  # is read-only, so a fork's PR gets no more than that.
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # A quiet week used to mean no advisory check at all: cargo-deny only ran
  # when somebody pushed. This run exists for the audit (and the format and
  # lint gates that come with it); it packages nothing.
  schedule:
    - cron: "17 6 * * 1"

# Superseded master runs are cancelled; a tag run is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GST_VERSION: "1.26.11"
  # SHA-256 of the exact pinned downloads (recompute with Get-FileHash if bumping).
  GST_RUNTIME_SHA256: "31CBC21FA0950B5C1E79C80959B2799805CB05A7A35953A13A9F790776137605"
  GST_DEVEL_SHA256: "AF0A0720692052AAF5FB0CF2847EF34A87016EF0F914328D516F049E6C86F587"
  WIX_ZIP_SHA256: "6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31"
  GST_BIN: 'C:\Program Files\gstreamer\1.0\msvc_x86_64\bin'
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    # The signing key lives in the release-signing environment, whose only
    # deployment rule is tags matching v*. Naming it on a tag run alone keeps
    # the key from everything else this job runs for: master pushes, pull
    # requests, the weekly audit, and manual runs on any branch, where a
    # modified copy of this workflow could otherwise print it. An empty name
    # is no environment at all, and naming it outright on a branch is refused
    # by the tag rule; both were checked on a probe branch before this relied
    # on them.
    environment: ${{ github.ref_type == 'tag' && 'release-signing' || '' }}
    # The video suite drives real media pipelines, which have deadlocked when
    # run concurrently; without a cap one hang would burn the six-hour default.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so a pull request can be diffed against its base to
          # decide whether the installer needs building (see the next step).
          fetch-depth: 0

      # The installer, the menu package and their custom actions used to be
      # built on a tag and nowhere else, so a mistake in any of them surfaced
      # only after the tag was pushed — three consecutive releases broke that
      # way. A pull request touching them now packages too. Secrets are not
      # exposed to pull requests, so the release key is out of reach there; the
      # package is signed with a throwaway key made and destroyed inside the
      # run instead, so registration and its removal are proven on the pull
      # request rather than first on a tag.
      - name: Package on pull requests that touch the installer
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $watched = @(
            'crates/kuvatin/wix/',
            'crates/kuvatin/msix/',
            'crates/kuvatin-shellext/',
            'crates/kuvatin/src/shell/',
            '.github/workflows/release.yml'
          )
          $changed = git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD"
          $hits = $changed | Where-Object { $file = $_; ($watched | Where-Object { $file.StartsWith($_) }).Count -gt 0 }
          if ($hits) {
            Write-Host "installer touched, packaging this run:`n  $($hits -join "`n  ")"
            'PACKAGE=true' | Out-File $env:GITHUB_ENV -Append
          } else {
            Write-Host 'no installer changes in this pull request; package steps stay off'
          }

      # rust-toolchain.toml is the single source of truth for the compiler
      # version. The action needs it as an argument (it cannot read the file,
      # and a SHA-pinned action has no ref to infer one from), so the version
      # is read out of the file rather than written down a second time: the
      # two used to be able to drift, and rustup would then install the
      # components for one toolchain while cargo used the other.
      - name: Read the toolchain version
        shell: pwsh
        run: |
          $line = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw 'no channel in rust-toolchain.toml' }
          $v = $line.Matches.Groups[1].Value
          Write-Host "toolchain from rust-toolchain.toml: $v"
          "RUST_TOOLCHAIN=$v" | Out-File $env:GITHUB_ENV -Append

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Only master runs write the cache (tag runs restore from it); save
          # even when tests fail so a red master still warms the next run.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      # For a tag build, the tag must match the workspace version the MSI is
      # stamped with — otherwise we'd publish e.g. v2.0.1 carrying a 2.0.0 MSI.
      # The landing page's JSON-LD carries the same version (its download
      # labels come from it), so it is checked too.
      - name: Verify tag matches Cargo.toml and the landing page
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -ne $tag) { throw "tag $tag != workspace version $ver" }
          $page = (Select-String -Path docs/index.html -Pattern '"softwareVersion":\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($page -ne $tag) { throw "docs/index.html softwareVersion $page != tag $tag (stamp it when bumping the version)" }
          Write-Host "tag, workspace version and landing page agree: $ver"

      - name: Format check
        run: cargo fmt --all --check

      # Licenses + RUSTSEC advisories across the whole dependency tree
      # (deny.toml). A prebuilt, checksum-verified binary (the official
      # cargo-deny action is a Linux container action and cannot run here).
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (licenses, advisories, sources)
        run: cargo deny check

      # The two installers are pinned by checksum, which makes them perfectly
      # cacheable: the key is the version and the hashes, so a cache entry can
      # only be reused for the exact bytes this run would have downloaded.
      # Every run used to pull ~300 MB before it could compile anything.
      - name: Cache the GStreamer installers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: gst-msi
          key: gst-${{ env.GST_VERSION }}-${{ env.GST_RUNTIME_SHA256 }}-${{ env.GST_DEVEL_SHA256 }}

      - name: Install GStreamer (runtime + devel), checksum-pinned
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          $dir = Join-Path $env:GITHUB_WORKSPACE "gst-msi"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $files = @(
            @{ Name = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi";       Sha = "$env:GST_RUNTIME_SHA256" },
            @{ Name = "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi"; Sha = "$env:GST_DEVEL_SHA256" }
          )
          foreach ($f in $files) {
            $path = Join-Path $dir $f.Name
            # A cached copy still has to match the pin before it is trusted;
            # anything else is downloaded again.
            if ((Test-Path $path) -and (Get-FileHash $path -Algorithm SHA256).Hash -eq $f.Sha) {
              Write-Host "$($f.Name): cached"
            } else {
              Remove-Item $path -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri "$base/$($f.Name)" -OutFile $path
            }
            $got = (Get-FileHash $path -Algorithm SHA256).Hash
            if ($got -ne $f.Sha) { throw "checksum mismatch for $($f.Name): got $got expected $($f.Sha)" }
            Start-Process msiexec -ArgumentList "/i", "`"$path`"", "/qn", "ADDLOCAL=ALL", "/norestart" -Wait -NoNewWindow
          }
          # The build env (PKG_CONFIG etc.) comes from .cargo/config.toml; add the
          # runtime bin to PATH so the harvest, the tests, and any run find it.
          "$env:GST_BIN" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Deterministic suites (no media, no GStreamer runtime) gate the release:
      # a failing tag push never ships. This is a single cargo invocation so its
      # exit code is the step's exit code.
      - name: Test (core + gui — gates the release)
        run: cargo test -p kuvatin-core -p kuvatin --release

      # The all-users uninstall's signed-out path cannot be exercised by an
      # account that is signed in (its hive stays mounted), so it is proven by a
      # test that builds a throwaway UsrClass.dat and cleans it. That test needs
      # SeBackup/SeRestore: locally, unelevated, it prints a reason and skips,
      # but under CI it panics instead of skipping (GitHub sets CI=true, and the
      # hosted runner IS elevated), so a skip here is a failed step. The exit
      # code is the gate — nothing greps for a skip line; --nocapture is only so
      # the reason is readable when it does fail. The one thing the exit code
      # cannot say is whether the name still matches anything: `--exact` with a
      # name that matches no test runs zero tests and exits 0, so a rename would
      # turn this gate off in silence. Hence the count below, which asks that
      # one test ran, not what it printed.
      - name: Test (offline hive cleanup — gates the release)
        shell: pwsh
        run: |
          # Only stdout is captured (the harness's own report and anything
          # --nocapture prints); cargo's progress and any compile error stay on
          # stderr and stream straight into this log.
          $out = cargo test -p kuvatin --release -- --exact shell::hive::tests::offline_cleanup_removes_only_kuvatin_verbs --nocapture | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "the offline hive test exited $LASTEXITCODE, so the signed-out cleanup path is unproven" }
          if ($out -notmatch '1 passed') { throw 'the offline hive test matched no test: has it been renamed or moved?' }

      # Self-contained video tests: they generate their own frames under the
      # workspace's target dir and drive real GES/GStreamer pipelines (encode,
      # cancel mid-render, EXR conversion, size normalisation). Blocking. Must
      # be single-threaded: concurrent GES pipelines deadlock.
      - name: Test (video engine, self-contained — gates the release)
        shell: pwsh
        run: |
          $env:RUST_BACKTRACE = "1"
          cargo test -p kuvatin-video --release -- --test-threads=1 `
            sequence:: previews_and_renders_an_image_sequence transport_and_edits_are_inert_while_rendering `
            export_settings_normalize_size_and_fps trim_math_never_goes_negative `
            stale_end_of_stream set_clip_duration_sets_and_clamps_a_still sets_canvas_size `
            slid neighbour confined_to_the_gap already_overlapping discovery_gives_up `
            without_blocking_the_caller document:: survives_being_saved missing_source encoder undo_ `
            removing_a_clip_straight_after_adding_it_does_not_crash removing_a_clip_added_while_playing_does_not_crash `
            removing_two_clips_back_to_back_while_playing_does_not_crash

      # Fixtures for everything that needs real media. They live under the
      # workspace (a clean long path — the runner's %TEMP% is an 8.3 short path
      # GStreamer's URI opener can choke on) and are built by a blocking step:
      # if they cannot be made, the steps that depend on them are not measuring
      # anything.
      - name: Build the live-media fixtures
        shell: pwsh
        run: |
          $fixdir = Join-Path $env:GITHUB_WORKSPACE "target\test-fixtures"
          New-Item -ItemType Directory -Force -Path $fixdir | Out-Null
          $fx = Join-Path $fixdir "fixture_av.webm"
          $img = Join-Path $fixdir "fixture.png"
          # Forward slashes: gst-launch unescapes backslashes in property values.
          $fxl = $fx -replace "\\", "/"
          $imgl = $img -replace "\\", "/"
          gst-launch-1.0 -e videotestsrc num-buffers=150 ! "video/x-raw,width=320,height=180" ! vp8enc ! webmmux name=m ! filesink location="$fxl" audiotestsrc num-buffers=300 ! audioconvert ! vorbisenc ! m.
          gst-launch-1.0 videotestsrc num-buffers=1 ! "video/x-raw,width=320,height=180" ! pngenc ! filesink location="$imgl"
          if (-not (Test-Path $fx) -or (Get-Item $fx).Length -eq 0) { throw "fixture webm not created at $fx" }
          if (-not (Test-Path $img) -or (Get-Item $img).Length -eq 0) { throw "fixture png not created at $img" }
          "GST_TEST_FILE=$fx" | Out-File $env:GITHUB_ENV -Append
          "GST_TEST_IMAGE=$img" | Out-File $env:GITHUB_ENV -Append

      # Regressions that only real media can catch. Two shipped once: an export
      # that came back instantly as a zero-byte file (a stale end-of-stream from
      # the preview was read as the render's result), and a gapped overlay
      # timeline that rendered something no player would open. They used to sit
      # inside the advisory step, where a failure was a line in a log nobody
      # reads. The other two guard undo: a left trim of real media written back,
      # which pins the order of in-point and duration writes, and a trimmed clip
      # restored with its in-point. One retry before it counts, because
      # asset-URI resolution on the hosted runner is occasionally flaky — a
      # second failure in a row is the code, not the runner.
      - name: Test (live-media regressions — gates the release)
        shell: pwsh
        run: |
          $env:RUST_BACKTRACE = "1"
          $names = @("renders_after_preview_eos", "renders_gapped_overlay_timeline",
            "undo_writes_a_left_trim_of_real_media_back", "undo_restores_a_trimmed_clip_of_real_media")
          foreach ($attempt in 1..2) {
            cargo test -p kuvatin-video --release -- --test-threads=1 --exact `
              project::tests::renders_after_preview_eos `
              project::tests::renders_gapped_overlay_timeline `
              project::tests::undo_writes_a_left_trim_of_real_media_back `
              project::tests::undo_restores_a_trimmed_clip_of_real_media
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 2) { throw "the live-media regressions failed twice: $($names -join ', ')" }
            Write-Host "::warning::live-media regressions failed once; retrying"
          }

      # The rest of the live-media suite is environment-sensitive on the hosted
      # runner, so it runs for signal but does NOT block.
      - name: Test (video integration — advisory, live media)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:RUST_BACKTRACE = "1"
          cargo test -p kuvatin-video --release -- --test-threads=1

      # The headline export path, end to end, with the shipped binary: generate
      # 48 PNG frames, render them to H.264 MP4 through the real right-click
      # entry point (--sequence-mp4, --quiet = no window), and discover the
      # result. Blocking.
      - name: Smoke render with the release exe (gates the release)
        shell: pwsh
        run: |
          cargo build --release -p kuvatin -p kuvatin-shellext
          $frames = Join-Path $env:GITHUB_WORKSPACE "target\smoke\frames"
          New-Item -ItemType Directory -Force -Path $frames | Out-Null
          # gst-launch unescapes backslashes in property values (C:\x -> C:x), so
          # locations use forward slashes.
          $loc = ($frames -replace "\\", "/") + "/frame_%04d.png"
          gst-launch-1.0 videotestsrc num-buffers=48 ! "video/x-raw,width=320,height=180" ! pngenc ! multifilesink location="$loc"
          $first = Join-Path $frames "frame_0000.png"
          if (-not (Test-Path $first)) { throw "frames not generated" }
          $p = Start-Process -FilePath "target\release\kuvatin.exe" -ArgumentList "--sequence-mp4","--fps","24","--quiet","`"$first`"" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "kuvatin --sequence-mp4 exited $($p.ExitCode)" }
          $mp4 = Join-Path $frames "frame.mp4"
          if (-not (Test-Path $mp4) -or (Get-Item $mp4).Length -lt 10KB) { throw "smoke render produced no usable MP4" }
          $info = & gst-discoverer-1.0 $mp4 2>&1 | Out-String
          if ($info -notmatch "H\.264") { Write-Host $info; throw "smoke render is not H.264" }
          Write-Host "smoke render OK: $((Get-Item $mp4).Length) bytes"

      # ---- MSI: tag pushes and manual dispatch only (master runs stop here) ----
      # cargo-wix is a source install, and the build cache is written only by
      # master runs, which never package — so every tag paid the full compile.
      # This cache is keyed on the exact version and holds just the binary.
      - name: Cache cargo-wix
        if: env.PACKAGE == 'true'
        id: wix-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~\.cargo\bin\cargo-wix.exe
          key: cargo-wix-0.3.9-${{ runner.os }}

      - name: Install cargo-wix
        if: env.PACKAGE == 'true' && steps.wix-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Install WiX Toolset v3 (no-admin binaries), checksum-pinned
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\wix3-bin"
          $zip = "$env:TEMP\wix314-binaries.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($got -ne "$env:WIX_ZIP_SHA256") { throw "checksum mismatch for wix314-binaries.zip: got $got expected $env:WIX_ZIP_SHA256" }
          Expand-Archive $zip -DestinationPath $dest -Force
          "$dest" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI (trimmed GStreamer runtime + third-party licenses)
        if: env.PACKAGE == 'true'
        shell: pwsh
        env:
          # A code-signing PFX (base64) + its password, which sign the Windows 11
          # context-menu package. They live in the release-signing environment,
          # so only a v* tag run has them; everywhere else they are empty. See
          # README, "Signing the menu package".
          SIGN_PFX_BASE64: ${{ secrets.KUVATIN_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.KUVATIN_SIGN_PFX_PASSWORD }}
        run: |
          # The bundle script walks kuvatin.exe's imports to compute the DLL
          # closure; the release binary exists from the smoke step.
          $stage = "$env:GITHUB_WORKSPACE\target\gst-staging"
          # The runtime's SBOM goes outside the workspace: the SBOM scan below
          # reads any SBOM-named file it finds, and would add these files twice.
          & crates\kuvatin\wix\bundle-gstreamer.ps1 -StageDir $stage -HeatExe "$env:USERPROFILE\wix3-bin\heat.exe" `
            -SbomOut "$env:RUNNER_TEMP\gstreamer-runtime.cdx.json" -DistributionSha256 "$env:GST_RUNTIME_SHA256"
          # The Windows 11 context-menu package (identity for the install dir;
          # the handler DLL is built with the exe above). Version = Cargo.toml.
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          "KUVATIN_VERSION=$ver" | Out-File $env:GITHUB_ENV -Append
          $msix = "$env:GITHUB_WORKSPACE\target\msix\Kuvatin.msix"
          # Windows refuses an unsigned package that hosts a COM server, so the
          # package is always signed; its Publisher must equal the certificate's
          # Subject. The public certificate rides along in the MSI, which trusts
          # it machine-wide before registering. A tag run signs with the release
          # key from the release-signing environment; every other packaging run
          # (installer pull requests, manual dispatch) signs with a throwaway
          # key made and destroyed inside this step, so those runs exercise the
          # signed-package paths too.
          $cer = ''
          if ($env:SIGN_PFX_BASE64) {
            $pfx = "$env:RUNNER_TEMP\kuvatin-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:SIGN_PFX_PASSWORD)
            & crates\kuvatin\msix\build-msix.ps1 -Version $ver -Out $msix -Publisher $cert.Subject
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]($_.Directory.Parent.Name) } | Select-Object -Last 1
            try {
              # /tr countersigns with a trusted time. Without it the signature
              # dies with the certificate, and every installer already shipped
              # would stop registering the menu on that day.
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_PFX_PASSWORD $msix
              if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
            } finally {
              # Never leave the decoded private key on the runner, not even
              # when signing threw.
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            }
            $cer = "$env:GITHUB_WORKSPACE\target\msix\kuvatin-signing.cer"
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            $thumb = $cert.Thumbprint
            Write-Host "package signed as $($cert.Subject) ($thumb)"
            'SIGNED=true' | Out-File $env:GITHUB_ENV -Append
          } else {
            # A tag publishes, and an unsigned package there is a release whose
            # Windows 11 entry never registers. A missing key on a tag means the
            # environment's secrets are missing, so the release stops here
            # rather than shipping that.
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              throw 'No signing key on a tag run: set KUVATIN_SIGN_PFX_BASE64 and KUVATIN_SIGN_PFX_PASSWORD in the release-signing environment (README, "Signing the menu package").'
            }
            # Every other packaging run (installer pull requests, manual
            # dispatch) signs with a THROWAWAY self-signed key, made here and
            # destroyed before the step ends, so those runs prove what an
            # unsigned package cannot: that the package registers, and that
            # uninstall removes it again for every account. The subject must
            # equal the manifest Publisher exactly, so the package family name
            # is the same one a release produces.
            $throwaway = New-SelfSignedCertificate -Type Custom -Subject 'CN=Ville Mattila' `
              -KeyUsage DigitalSignature -FriendlyName 'Kuvatin CI throwaway' `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            $pfx = "$env:RUNNER_TEMP\kuvatin-ci-sign.pfx"
            $pw = [Guid]::NewGuid().ToString('N')
            Write-Host "::add-mask::$pw"
            $store = "Cert:\CurrentUser\My\$($throwaway.Thumbprint)"
            Export-PfxCertificate -Cert $store -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
            try {
              & crates\kuvatin\msix\build-msix.ps1 -Version $ver -Out $msix -Publisher $throwaway.Subject
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]($_.Directory.Parent.Name) } | Select-Object -Last 1
              # No /tr: this signature is not meant to outlive the run, and a
              # timestamp server is one more thing that can be down.
              & $signtool.FullName sign /fd SHA256 /f $pfx /p $pw $msix
              if ($LASTEXITCODE -ne 0) { throw "signtool (throwaway key) exited $LASTEXITCODE" }
              # Same path the real branch uses, so the `if ($cer)` block below
              # passes SignCerPath/SignCerThumbprint to WiX unchanged: the
              # installer trusts this certificate and KuvatinUntrustCert
              # removes it again by thumbprint.
              $cer = "$env:GITHUB_WORKSPACE\target\msix\kuvatin-signing.cer"
              Export-Certificate -Cert $store -FilePath $cer | Out-Null
              $thumb = $throwaway.Thumbprint
              Write-Host "package signed with a THROWAWAY key ($($throwaway.Subject) $thumb)"
              'SIGNED=true' | Out-File $env:GITHUB_ENV -Append
            } finally {
              # Never leave the private key behind, not even when signing threw.
              # The exported .cer stays: the WiX build and the install test
              # both need it.
              # -DeleteKey: without it the certificate goes but its CNG key
              # container stays on disk, which is the private key.
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
              Remove-Item $store -Force -DeleteKey -ErrorAction SilentlyContinue
            }
          }
          cd crates\kuvatin
          # Two explicit command lines: splatting an argument array into a
          # native command silently dropped the signing variables under pwsh,
          # and the installer shipped without the certificate.
          if ($cer) {
            Write-Host "cargo wix with GstStageDir, MsixPath, SignCerPath=$cer, SignCerThumbprint=$thumb"
            cargo wix -p kuvatin --nocapture --compiler-arg "-dGstStageDir=$stage" --compiler-arg "-dMsixPath=$msix" --compiler-arg "-dSignCerPath=$cer" --compiler-arg "-dSignCerThumbprint=$thumb"
          } else {
            Write-Host 'cargo wix with GstStageDir, MsixPath (unsigned package)'
            cargo wix -p kuvatin --nocapture --compiler-arg "-dGstStageDir=$stage" --compiler-arg "-dMsixPath=$msix"
          }
          cd ..\..
          # A fixed-name copy so the landing page can link the latest release
          # statically, and a checksum file for the (unsigned) installer.
          $msi = Get-ChildItem target\wix\kuvatin-*-x86_64.msi | Select-Object -First 1
          Copy-Item $msi.FullName (Join-Path $msi.DirectoryName "kuvatin-x86_64.msi")
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          # LF, not Out-File's CRLF: `sha256sum -c` (Git Bash, Linux) rejects a CR in the name.
          [IO.File]::WriteAllText("$($msi.FullName).sha256", "$hash  $($msi.Name)`n")
          # The landing page links the fixed-name copy, whose checksum file has
          # to name *that* file or `sha256sum -c` fails on the filename even
          # though the bytes match.
          [IO.File]::WriteAllText(
            (Join-Path $msi.DirectoryName "kuvatin-x86_64.msi.sha256"),
            "$hash  kuvatin-x86_64.msi`n")
          Get-ChildItem target\wix

      # Install the MSI the way a user would and drive the INSTALLED exe with
      # the runner's GStreamer hidden from PATH: only the bundled runtime may
      # satisfy it. A plugin missing from the allow-list fails here.
      - name: Install test (installed exe converts and renders)
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target\wix\kuvatin-*-x86_64.msi | Select-Object -First 1).FullName
          $log = "$env:TEMP\kuvatin-install.log"
          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/norestart","/l*v","`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log | Select-Object -Last 80; throw "msiexec /i exited $($p.ExitCode)" }
          $exe = "C:\Program Files\kuvatin\bin\kuvatin.exe"
          if (-not (Test-Path $exe)) { throw "installed exe missing at $exe" }
          # The Start menu component is keyed on a per-user registry value
          # (ICE38/ICE43 allow nothing else for a shortcut in ProgramMenuFolder),
          # while the package itself is per-machine. Nothing used to check that
          # the shortcut arrives in the all-users menu, or that it leaves again.
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Kuvatin'
          if (-not (Test-Path (Join-Path $startMenu 'Kuvatin.lnk'))) {
            throw "install did not create the all-users Start menu shortcut in $startMenu"
          }
          # --register ran as a deferred, impersonated custom action: the Explorer
          # verb must now exist in THIS user's hive and point at the installed exe.
          $verb = 'HKCU:\Software\Classes\SystemFileAssociations\.png\shell\Kuvatin'
          if (-not (Test-Path $verb)) {
            Get-Content $log | Select-String 'KuvatinRegister' | Select-Object -Last 6
            throw "install did not register the Explorer verb ($verb missing)"
          }
          $icon = (Get-ItemProperty $verb).Icon
          if ($icon -ne $exe) { throw "Explorer verb points at '$icon', expected '$exe'" }
          # Windows 11 top-level menu: the sparse package must be registered for
          # this user with the install dir as its external location. These used
          # to be skipped when the package was unsigned or the runner was older
          # than build 22000; every packaging run signs now (a throwaway key
          # when the release key is out of reach) and the hosted runner is
          # build 26100, so a run where they would not apply is a run whose
          # package half proves nothing, and it says so rather than passing.
          $build = [int](Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber
          Get-Content "$env:LOCALAPPDATA\Kuvatin\kuvatin.log" -ErrorAction SilentlyContinue | Select-String 'Windows 11 menu' | Select-Object -Last 1
          if ($build -lt 22000) { throw "runner build $build predates the Windows 11 menu: the package assertions cannot run here" }
          if ($env:SIGNED -ne 'true') { throw "SIGNED is '$env:SIGNED', not true: the package assertions would all be skipped" }
          if (-not (Test-Path 'C:\Program Files\kuvatin\bin\kuvatin-signing.cer')) { throw 'signed build, but the installer did not ship kuvatin-signing.cer (SignCerPath not passed to WiX?)' }
          $pkg = Get-AppxPackage VilleMattila.Kuvatin
          if (-not $pkg) {
            Write-Host '--- Trusted People (machine):'
            Get-ChildItem Cert:\LocalMachine\TrustedPeople | ForEach-Object { "  $($_.Subject) $($_.Thumbprint)" }
            Write-Host '--- installer log, certificate + register actions:'
            Get-Content $log | Select-String 'KuvatinTrustCert|KuvatinRegister|certutil' | ForEach-Object { $_.Line } | Select-Object -Last 12
            throw "signed sparse package not registered on build $build"
          }
          Write-Host "sparse package registered: $($pkg.PackageFullName) ($($pkg.SignatureKind))"
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -notlike '*gstreamer*' }) -join ';'
          $work = Join-Path $env:GITHUB_WORKSPACE "target\smoke\installed"
          New-Item -ItemType Directory -Force -Path "$work\frames" | Out-Null
          Copy-Item "target\smoke\frames\frame_*.png" "$work\frames"
          # 1) a preset conversion (image pipeline)
          Copy-Item "$work\frames\frame_0000.png" "$work\photo.png"
          # Start-Process joins the list with spaces and does NOT quote, so the
          # preset name must carry its own quotes (it arrived as `Convert`).
          $p = Start-Process -FilePath $exe -ArgumentList "--preset","`"Convert to WebP`"","--quiet","`"$work\photo.png`"" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "installed --preset exited $($p.ExitCode)" }
          $webp = Get-ChildItem "$work\*.webp" | Select-Object -First 1
          if (-not $webp -or $webp.Length -lt 100) { throw "installed exe produced no WebP" }
          # 2) a sequence render (video engine, bundled encoder)
          $p = Start-Process -FilePath $exe -ArgumentList "--sequence-mp4","--fps","24","--quiet","`"$work\frames\frame_0000.png`"" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "installed --sequence-mp4 exited $($p.ExitCode)" }
          $mp4 = "$work\frames\frame.mp4"
          if (-not (Test-Path $mp4) -or (Get-Item $mp4).Length -lt 10KB) { throw "installed exe produced no usable MP4" }
          Write-Host "installed exe OK: $($webp.Name) ($($webp.Length) B), frame.mp4 ($((Get-Item $mp4).Length) B)"
          # Kuvatin stays installed: the next step updates over it, and the one
          # after that uninstalls it, after two more accounts have registered
          # it, and checks what every account keeps.

      # An installer cannot replace a running executable, so the app copies
      # itself into a staging folder and lets the copy do the installing. This
      # drives that copy against the installer built in this run, over the
      # install the step above just made: same version, so the package's
      # AllowSameVersionUpgrades is what makes it a legal reinstall.
      - name: Update test (the staged helper installs over a real install)
        if: env.PACKAGE == 'true'
        # An install that fails puts up a message box the helper's own code
        # waits on, and nothing here can dismiss it: fail in minutes rather
        # than eat the job's 75.
        timeout-minutes: 15
        shell: pwsh
        run: |
          $built = (Get-ChildItem target\wix\kuvatin-*-x86_64.msi | Select-Object -First 1).FullName
          # The install step above checks this exact path; the product
          # installs into bin\, not straight into the product folder.
          $installed = "C:\Program Files\kuvatin\bin\kuvatin.exe"
          if (-not (Test-Path $installed)) { throw "no installed kuvatin.exe to copy: the install step did not run" }
          $stage = Join-Path $env:TEMP 'kuvatin\update'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $helper = Join-Path $stage 'kuvatin-updater.exe'
          Copy-Item $installed $helper -Force
          # The real flow downloads the installer INTO the staging folder and
          # the helper deletes it once it has installed, so it gets a copy
          # there. Handing it target\wix\ directly would delete the artifact
          # the uninstall test and the release upload still need.
          $msi = Join-Path $stage (Split-Path $built -Leaf)
          Copy-Item $built $msi -Force

          # --after wants a process that has already exited, which is what the
          # helper will find in the real flow by the time it looks.
          $dead = Start-Process cmd -ArgumentList '/c','exit' -PassThru -Wait
          # No --relaunch: nothing should open a window on the runner.
          $p = Start-Process $helper -ArgumentList '--apply-update',"`"$msi`"",'--after',$dead.Id -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the staged updater exited $($p.ExitCode)" }

          if (-not (Test-Path $installed)) { throw 'the update removed the app instead of replacing it' }
          # Deliberately NOT Win32_Product: enumerating it runs a consistency
          # check against every installed package and can reconfigure them.
          # The uninstall registry key answers the same question for nothing.
          $keys = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $product = Get-ItemProperty $keys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'Kuvatin' } | Select-Object -First 1
          if (-not $product) { throw 'Kuvatin is no longer registered as installed' }
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Kuvatin'
          if (-not (Test-Path (Join-Path $startMenu 'Kuvatin.lnk'))) {
            throw 'the update left the all-users Start menu shortcut behind'
          }
          Write-Host "updater ran clean; Kuvatin $($product.DisplayVersion) is installed"

          # It deletes the installer it used — best-effort, because the folder
          # is swept at the next start anyway — and leaves its own copy there
          # for that sweep.
          if (Test-Path $msi) { Write-Host 'note: the staged installer is still there; the next start sweeps the folder' }
          if (-not (Test-Path $built)) { throw 'the built MSI is gone: the uninstall test and the release upload still need it' }
          Get-Content "$env:LOCALAPPDATA\Kuvatin\kuvatin.log" -ErrorAction SilentlyContinue |
            Select-String 'update:' | Select-Object -Last 6

      # Uninstall must clean EVERY account, not just the uninstalling one
      # (backlog pk-uninst). Two extra local accounts register Kuvatin the way a
      # real first launch would: a password-logon scheduled task loads the
      # user's profile, so HKCU is their own classes hive and the sparse package
      # registers in their context (proven by the pk-uninst probe). A fresh
      # account has no "Log on as a batch job" right, so secedit grants it first
      # — without that the tasks never start (0x41303). kvon is held signed in
      # across the uninstall, which the step asserts, so the loaded-hive path is
      # always exercised; kvoff's task ends and its hive unloads if the profile
      # service gets round to it, which the probe measured it usually does not,
      # so the offline UsrClass.dat path is a bonus here and is really gated by
      # the offline hive unit test. Then uninstall as the runner and assert that
      # all three accounts are clean.
      - name: Uninstall test (every account)
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # reg query on a missing key exits 1, and net user, secedit and
          # wevtutil are chatty: native exit codes must not abort this step.
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = 'C:\Program Files\kuvatin\bin\kuvatin.exe'
          $msi = (Get-ChildItem target\wix\kuvatin-*-x86_64.msi | Select-Object -First 1).FullName
          # The install test's $build went with its step.
          $build = [int](Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber
          # Every package assertion below is written `SIGNED -eq true -and …`,
          # so an unsigned run would not fail them, it would skip them. A
          # packaging run always signs now, and if that ever stops being true
          # this step must say so rather than quietly prove half as much.
          if ($env:SIGNED -ne 'true') { throw "SIGNED is '$env:SIGNED', not true: the package assertions would all be skipped" }
          $log = "$env:TEMP\kuvatin-uninstall.log"
          New-Item -ItemType Directory -Force C:\kvtest\users, C:\kvtest\out | Out-Null
          # The tasks run as ordinary users and write their transcript here.
          icacls C:\kvtest\out /grant '*S-1-5-32-545:(OI)(CI)M' | Out-Null
          # A task that never started says why only if this log is on.
          wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true
          $png1x1 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='

          # What each account runs: register, one right-click conversion, and a
          # stand-in cache entry (a real one needs EXR frames).
          @'
          param([Parameter(Mandatory)][string]$User)
          Start-Transcript -Path "C:\kvtest\out\$User.txt" -Force | Out-Null
          $exe = 'C:\Program Files\kuvatin\bin\kuvatin.exe'
          "$(whoami): USERPROFILE=$env:USERPROFILE TEMP=$env:TEMP"
          $p = Start-Process $exe -ArgumentList '--register','--quiet' -Wait -PassThru
          "--register exited $($p.ExitCode)"
          # Name the culprit here: otherwise the runner only sees a task that
          # ended with 1 and a precondition that fails much later.
          if ($p.ExitCode -ne 0) { throw "--register exited $($p.ExitCode)" }
          # Start-Process joins the list with spaces and does NOT quote, so the
          # preset name carries its own quotes.
          $png = "C:\kvtest\users\$User\photo.png"
          $p = Start-Process $exe -ArgumentList '--preset','"Convert to WebP"','--quiet',"`"$png`"" -Wait -PassThru
          "--preset exited $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "--preset exited $($p.ExitCode)" }
          New-Item -ItemType Directory -Force "$env:TEMP\kuvatin\seq-cache\probe" | Out-Null
          Set-Content "$env:TEMP\kuvatin\seq-cache\probe\.complete" 'x'
          Stop-Transcript | Out-Null
          '@ | Set-Content C:\kvtest\as-user.ps1

          function Sid([string]$u) { ([Security.Principal.NTAccount]::new($u)).Translate([Security.Principal.SecurityIdentifier]).Value }
          function ProfDir([string]$sid) { (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid").ProfileImagePath }

          # Whatever fails, these two answer "did the SYSTEM action run, and did
          # the accounts do their half?" — WixQuietExec64 copies the action's
          # stdout (every line prefixed `Kuvatin: `) into the MSI log.
          function Show-Diagnostics {
            if ($log -and (Test-Path $log)) {
              Write-Host '--- uninstall log: the all-users action and its report'
              Get-Content $log | Select-String 'KuvatinUnregisterAllUsers|Kuvatin: ' | ForEach-Object { $_.Line }
            } else {
              Write-Host '--- no uninstall log yet: this failed before msiexec /x ran'
            }
            Write-Host '--- Task Scheduler events for the account tasks'
            Get-WinEvent -LogName Microsoft-Windows-TaskScheduler/Operational -MaxEvents 200 -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'kv-kvoff|kv-kvon|kv-hold' } |
              ForEach-Object { '  event {0} {1:HH:mm:ss}: {2}' -f $_.Id, $_.TimeCreated, ($_.Message -replace '\s+', ' ') }
          }

          function Register-As([string]$User, [string]$Password) {
            $arg = "-NoProfile -ExecutionPolicy Bypass -File C:\kvtest\as-user.ps1 -User $User"
            $a = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Argument $arg
            $s = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Hours 1) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
            Register-ScheduledTask -TaskName "kv-$User" -Action $a -Settings $s -User "$env:COMPUTERNAME\$User" -Password $Password -RunLevel Limited -Force | Out-Null
            Start-ScheduledTask -TaskName "kv-$User"
            $deadline = (Get-Date).AddMinutes(4)
            do { Start-Sleep -Seconds 3; $state = (Get-ScheduledTask -TaskName "kv-$User").State } while ($state -in 'Queued','Running' -and (Get-Date) -lt $deadline)
            $rc = (Get-ScheduledTaskInfo -TaskName "kv-$User").LastTaskResult
            Write-Host ('kv-{0}: state {1}, last result 0x{2:X8}' -f $User, $state, $rc)
            $out = "C:\kvtest\out\$User.txt"
            if (Test-Path $out) { Get-Content $out | ForEach-Object { "  $_" } }
            if ($rc -ne 0) { throw "registration task kv-$User failed (0x$('{0:X8}' -f $rc))" }
          }

          # How many of the 17 classic keys an account still has. reg.exe only:
          # a PowerShell provider handle would block the hive unload.
          function Count-Keys([string]$sid) {
            $exts = '.png','.jpg','.jpeg','.jpe','.jfif','.webp','.bmp','.tiff','.tif','.gif','.exr'
            $rel = @($exts | ForEach-Object { "SystemFileAssociations\$_\shell\Kuvatin" }) + @(
              'SystemFileAssociations\image\shell\Kuvatin','Directory\shell\Kuvatin','Directory\Background\shell\Kuvatin',
              'Kuvatin.CommandStore','Kuvatin.CommandStore.Background','Kuvatin.CommandStore.Frames')
            $root = "HKU\$($sid)_Classes"
            $mounted = $false
            if (-not (Test-Path "Registry::HKEY_USERS\$($sid)_Classes")) {
              $root = "HKU\kv-check-$sid"
              reg load $root (Join-Path (ProfDir $sid) 'AppData\Local\Microsoft\Windows\UsrClass.dat') *> $null
              if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0; return -1 }
              $mounted = $true
            }
            $n = @($rel | Where-Object { reg query "$root\$_" *> $null; $LASTEXITCODE -eq 0 }).Count
            if ($mounted) {
              [GC]::Collect(); [GC]::WaitForPendingFinalizers()
              reg unload $root *> $null
              # A hive this check leaves mounted is one the SYSTEM action's own
              # RegLoadKeyW then cannot open, which comes back as -1 keys and
              # reads like a missing profile. Say it where it happened.
              if ($LASTEXITCODE -ne 0) { Write-Host "::warning::reg unload $root exited $LASTEXITCODE; $sid's classes hive may still be mounted" }
            }
            $global:LASTEXITCODE = 0
            return $n
          }

          try {
            $sids = @()
            foreach ($u in 'kvoff','kvon') {
              # 14 characters: net user stops to ask a Y/N question for longer ones.
              $pw = 'Kv1!' + [guid]::NewGuid().ToString('N').Substring(0,10)
              Write-Host "::add-mask::$pw"
              net user $u $pw /add /passwordchg:no /expires:never | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "net user $u exited $LASTEXITCODE" }
              New-Item -ItemType Directory -Force "C:\kvtest\users\$u" | Out-Null
              [IO.File]::WriteAllBytes("C:\kvtest\users\$u\photo.png", [Convert]::FromBase64String($png1x1))
              icacls "C:\kvtest\users\$u" /grant "${u}:(OI)(CI)M" | Out-Null
              Set-Variable "PW_$u" $pw
              $sids += '*' + (Sid $u)
            }
            # Grant both accounts the batch logon right, adding to whatever the
            # runner image already lists rather than replacing it.
            secedit /export /cfg C:\kvtest\rights.inf /areas USER_RIGHTS | Out-Null
            $inf = Get-Content C:\kvtest\rights.inf
            if ($inf -match '^SeBatchLogonRight') {
              $inf = $inf -replace '^(SeBatchLogonRight\s*=.*)$', ('$1,' + ($sids -join ','))
            } else {
              $inf = $inf -replace '^(\[Privilege Rights\])$', ("`$1`r`nSeBatchLogonRight = " + ($sids -join ','))
            }
            # secedit reads Unicode only.
            $inf | Set-Content -Encoding Unicode C:\kvtest\rights-new.inf
            secedit /configure /db C:\kvtest\rights.sdb /cfg C:\kvtest\rights-new.inf /areas USER_RIGHTS | Out-Null
            secedit /export /cfg C:\kvtest\after.inf /areas USER_RIGHTS | Out-Null
            # secedit reports success on stdout and can still have granted
            # nothing; read the right back instead of believing it, or the
            # failure resurfaces a step later as a task that never starts.
            # It accepts either spelling going in and picks its own coming out:
            # the runner's line came back with these two local accounts as
            # NAMES and the builtin groups as SIDs. The SID goes in (a name is
            # locale-sensitive, survives no rename, and one containing a comma
            # would corrupt the line) and both spellings are accepted back,
            # with any DOMAIN\ or machine\ prefix dropped.
            $line = ((@(Get-Content C:\kvtest\after.inf) -match '^SeBatchLogonRight') -join ' ')
            Write-Host "SeBatchLogonRight now: $line"
            $holders = @(($line -split '=', 2)[-1] -split ',' | ForEach-Object { (($_.Trim() -replace '^\*', '') -split '\\')[-1] })
            foreach ($u in 'kvoff','kvon') {
              $sid = Sid $u
              if ($holders -notcontains $sid -and $holders -notcontains $u) {
                throw "secedit did not grant the batch logon right to $u ($sid), so its task would fail to start (0x41303); the right lists: $line"
              }
              Write-Host "  $u holds the batch logon right"
            }

            Register-As kvoff (Get-Variable PW_kvoff -ValueOnly)
            Register-As kvon (Get-Variable PW_kvon -ValueOnly)
            # kvon stays signed in: hold its hive mounted across the uninstall.
            $ha = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -Argument '-NoProfile -Command Start-Sleep -Seconds 900'
            $hs = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Hours 1)
            Register-ScheduledTask -TaskName kv-hold -Action $ha -Settings $hs -User "$env:COMPUTERNAME\kvon" -Password (Get-Variable PW_kvon -ValueOnly) -RunLevel Limited -Force | Out-Null
            Start-ScheduledTask -TaskName kv-hold
            Start-Sleep -Seconds 5
            # kvoff's task has ended, so kvoff is signed out; the profile
            # service unloads the classes hive when it feels like it. Poll the
            # key everything here branches on, not the plain user hive.
            $offSid = Sid kvoff
            $t0 = Get-Date
            while ((Test-Path "Registry::HKEY_USERS\$($offSid)_Classes") -and ((Get-Date) - $t0).TotalSeconds -lt 180) { Start-Sleep -Seconds 3 }
            if (Test-Path "Registry::HKEY_USERS\$($offSid)_Classes") {
              # The probe measured the same, so this is the usual outcome and
              # not a failure — but it does mean this run proves less.
              Write-Host "::warning::kvoff's classes hive is still mounted after 180 s, so BOTH accounts exercise the LOADED-hive path this run and the offline UsrClass.dat path is not exercised end to end here; that path is gated by the unit test shell::hive::tests::offline_cleanup_removes_only_kuvatin_verbs instead."
            } else {
              Write-Host ('kvoff signed out after {0} s: this run exercises the offline UsrClass.dat path as well' -f [int]((Get-Date) - $t0).TotalSeconds)
            }
            # kvon must be signed in, or the loaded-hive path goes unproven and
            # nothing here would have noticed. The hold task has just started,
            # so give the profile a moment to come back if it was unloading.
            $onSid = Sid kvon
            $t1 = Get-Date
            while (-not (Test-Path "Registry::HKEY_USERS\$($onSid)_Classes") -and ((Get-Date) - $t1).TotalSeconds -lt 60) { Start-Sleep -Seconds 3 }
            if (-not (Test-Path "Registry::HKEY_USERS\$($onSid)_Classes")) {
              throw "kvon's classes hive is not loaded: kv-hold did not keep it signed in, so the loaded-hive path would go unproven"
            }
            Write-Host 'kvon is signed in: the loaded-hive path is exercised'

            # Preconditions, so the test cannot pass vacuously.
            foreach ($u in 'kvoff','kvon') {
              $sid = Sid $u
              $dir = ProfDir $sid
              # 16 of 17: the legacy 'image' root is absent on a fresh install.
              $have = Count-Keys $sid
              if ($have -lt 16) { throw "$u registered only $have verb key(s) before uninstall" }
              if ($env:SIGNED -eq 'true' -and $build -ge 22000) {
                $forUser = Get-AppxPackage -AllUsers VilleMattila.Kuvatin | Where-Object { $_.PackageUserInformation.UserSecurityId.Sid -contains $sid }
                if (-not $forUser) { throw "$u did not register the sparse package before uninstall" }
              }
              if (-not (Test-Path (Join-Path $dir 'AppData\Local\Kuvatin\kuvatin.log'))) { throw "$u has no log before uninstall" }
              if (-not (Test-Path (Join-Path $dir 'AppData\Local\Temp\kuvatin\seq-cache'))) { throw "$u has no cache before uninstall" }
              if (-not (Test-Path (Join-Path $dir 'AppData\Roaming\Kuvatin\presets.toml'))) { throw "$u has no presets before uninstall" }
              Write-Host "$u is registered: $have verb key(s), log, cache and presets in $dir"
            }

            # Uninstall as the runner, verbosely: WixQuietExec64 copies the
            # SYSTEM action's stdout into this log.
            $p = Start-Process msiexec -ArgumentList "/x","`"$msi`"","/qn","/norestart","/l*v","`"$log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
            $report = @(Get-Content $log | Select-String 'KuvatinUnregisterAllUsers|Kuvatin: ')
            $report | Select-Object -Last 30 | ForEach-Object { $_.Line }
            # Every line the all-users pass prints is prefixed `Kuvatin: `. With
            # none of them the action never ran (unscheduled, condition false,
            # WixQuietExec64 not linked) and every assertion below would be
            # measuring an uninstall that was only ever the per-user one.
            if (-not ($report | Where-Object { $_.Line -match 'Kuvatin: ' })) {
              throw 'the uninstall log carries no "Kuvatin: " line: the all-users action never ran'
            }

            # The uninstalling account (what the install test used to check).
            if (Test-Path $exe) { throw "uninstall left $exe behind" }
            if (Test-Path 'HKCU:\Software\Classes\SystemFileAssociations\.png\shell\Kuvatin') { throw "uninstall left the runner's Explorer verb behind" }
            $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Kuvatin'
            if (Test-Path $startMenu) { throw "uninstall left the Start menu folder behind" }

            # Every other account.
            foreach ($u in 'kvoff','kvon') {
              $sid = Sid $u
              $dir = ProfDir $sid
              $left = Count-Keys $sid
              if ($left -ne 0) { throw "${u}: uninstall left $left verb key(s) behind" }
              if (Test-Path (Join-Path $dir 'AppData\Local\Kuvatin\kuvatin.log')) { throw "${u}: uninstall left the log behind" }
              if (Test-Path (Join-Path $dir 'AppData\Local\Temp\kuvatin')) { throw "${u}: uninstall left %TEMP%\kuvatin behind" }
              $pkgLeft = Get-ChildItem (Join-Path $dir 'AppData\Local\Packages') -Filter 'VilleMattila.Kuvatin_*' -ErrorAction SilentlyContinue
              if ($pkgLeft) { throw "${u}: uninstall left $($pkgLeft.Name) behind" }
              if (-not (Test-Path (Join-Path $dir 'AppData\Roaming\Kuvatin\presets.toml'))) { throw "${u}: uninstall deleted the presets, which must be kept" }
              Write-Host "${u}: no verb keys, no log, no cache, no package data, presets kept"
            }
            if ($env:SIGNED -eq 'true' -and $build -ge 22000) {
              $stillThere = Get-AppxPackage -AllUsers VilleMattila.Kuvatin -ErrorAction SilentlyContinue
              if ($stillThere) { throw "uninstall left the sparse package registered for $($stillThere.PackageUserInformation.UserSecurityId.Sid -join ', ')" }
            }
            if ($env:SIGNED -eq 'true' -and (Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object { $_.Subject -like 'CN=Ville Mattila*' })) {
              throw "uninstall left the signing certificate in Trusted People"
            }
            # The SYSTEM pass must not have written into the system profile.
            if (Test-Path 'C:\Windows\System32\config\systemprofile\AppData\Local\Kuvatin') {
              throw "the SYSTEM cleanup seeded a Kuvatin folder in the system profile"
            }
            # reg.exe's last exit code (1 for a missing key) is what GitHub
            # would exit pwsh with otherwise.
            $global:LASTEXITCODE = 0
            Write-Host 'every account is clean after uninstall'
          } catch {
            # Whatever the diagnostics do, the failure that got us here is the
            # one that must reach the log and fail the step.
            try { Show-Diagnostics } catch { Write-Host "::warning::the diagnostics themselves failed: $($_.Exception.Message)" }
            throw
          }

      # Software bill of materials for the release (CycloneDX). The scan knows
      # the Rust crates; the step after it adds the bundled GStreamer runtime.
      # Only when packaging: it runs after a release build, so on an ordinary
      # push it would walk the staged GStreamer runtime and the MSI for
      # nothing. The name is taken from the version rather than the ref, which
      # on a pull request is "123/merge" and puts a slash in the path.
      - name: SBOM (CycloneDX)
        if: env.PACKAGE == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: target/kuvatin-v${{ env.KUVATIN_VERSION }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Most of what the installer redistributes is the GStreamer runtime, and
      # the staging script wrote down exactly which files of it ship.
      - name: Add the bundled runtime to the SBOM
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          & crates\kuvatin\wix\merge-sbom.ps1 `
            -Sbom "target\kuvatin-v$env:KUVATIN_VERSION-sbom.cdx.json" `
            -Add "$env:RUNNER_TEMP\gstreamer-runtime.cdx.json"

      - name: Collect release files
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\wix\*.msi dist
          Copy-Item target\wix\*.sha256 dist
          Copy-Item target\kuvatin-*-sbom.cdx.json dist
          Get-ChildItem dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PACKAGE == 'true'
        with:
          name: kuvatin-windows-msi
          path: dist/*

  # The only job that may write to the repository: it attaches the files the
  # build job produced to the release for the tag. Nothing here compiles or
  # executes third-party code.
  publish:
    name: Publish release assets
    needs: build
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kuvatin-windows-msi
          path: dist

      # The release used to be published with an empty body and the notes
      # pasted in by hand afterwards, so for a few minutes a release existed
      # with nothing describing it. The notes come from the changelog instead,
      # and a tag whose version has no section there fails here rather than
      # publishing something blank.
      - name: Release notes from the changelog
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v want="## [$ver]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $ver - write it before tagging" >&2
            exit 1
          fi
          echo "release notes for $ver:"
          cat release-notes.md

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
