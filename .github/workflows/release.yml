name: release

# Build + test on every push to master; build, install-test and publish the
# Windows .msi on a version tag (v2.0.0 — attached to the GitHub Release) or on
# manual dispatch (uploaded as a workflow artifact).
#
# Why master runs exist: GitHub's Actions cache is scoped by git ref — a run can
# only restore caches saved on its own ref or on the default branch. With
# tag-only runs, every release started from a cold cache and recompiled all
# ~400 dependency crates (11+ minutes). Master runs save the dependency cache
# on the default branch, tag runs restore it, and cargo's fingerprinting then
# rebuilds only the workspace crates (and any dependency that actually changed).
# Only master runs save (a tag-scoped cache is dead weight: nothing can read it).
#
# Hardening: third-party downloads (GStreamer MSIs, WiX zip) are pinned by
# SHA-256 and the build fails on mismatch — they are executed and their DLLs are
# harvested into the shipped installer, so an upstream/CDN compromise must not
# flow through. Actions are pinned to commit SHAs. The toolchain is pinned by
# rust-toolchain.toml. The workflow runs with read-only repository access; only
# the final publish job (tags) may write, and it only ever uploads assets.
#
# Gates, in order: fmt, clippy (-D warnings), cargo-deny (licenses +
# advisories), the deterministic suites (core + gui), the self-contained video
# suite (generated frames, real GStreamer pipelines), and a headless smoke
# render with the release exe. A tag additionally installs the built MSI and
# converts an image + renders a sequence with the INSTALLED copy (bundled
# runtime only), so a plugin missing from the bundle fails here, not on a
# user's machine. The live-media video tests (fixture webm) stay advisory —
# asset-URI resolution has been flaky on the hosted runner.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  # Pull requests (Dependabot's included) get the same gates; the workflow
  # is read-only, so a fork's PR gets no more than that.
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # A quiet week used to mean no advisory check at all: cargo-deny only ran
  # when somebody pushed. This run exists for the audit (and the format and
  # lint gates that come with it); it packages nothing.
  schedule:
    - cron: "17 6 * * 1"

# Superseded master runs are cancelled; a tag run is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GST_VERSION: "1.26.11"
  # SHA-256 of the exact pinned downloads (recompute with Get-FileHash if bumping).
  GST_RUNTIME_SHA256: "31CBC21FA0950B5C1E79C80959B2799805CB05A7A35953A13A9F790776137605"
  GST_DEVEL_SHA256: "AF0A0720692052AAF5FB0CF2847EF34A87016EF0F914328D516F049E6C86F587"
  WIX_ZIP_SHA256: "6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31"
  GST_BIN: 'C:\Program Files\gstreamer\1.0\msvc_x86_64\bin'
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build, test, package
    runs-on: windows-latest
    # The video suite drives real media pipelines, which have deadlocked when
    # run concurrently; without a cap one hang would burn the six-hour default.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history so a pull request can be diffed against its base to
          # decide whether the installer needs building (see the next step).
          fetch-depth: 0

      # The installer, the menu package and their custom actions used to be
      # built on a tag and nowhere else, so a mistake in any of them surfaced
      # only after the tag was pushed — three consecutive releases broke that
      # way. A pull request touching them now packages too. Secrets are not
      # exposed to pull requests, so that package is unsigned; the install test
      # already treats signing as optional and skips the registration check.
      - name: Package on pull requests that touch the installer
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $watched = @(
            'crates/kuvatin/wix/',
            'crates/kuvatin/msix/',
            'crates/kuvatin-shellext/',
            'crates/kuvatin/src/shell/',
            '.github/workflows/release.yml'
          )
          $changed = git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD"
          $hits = $changed | Where-Object { $file = $_; ($watched | Where-Object { $file.StartsWith($_) }).Count -gt 0 }
          if ($hits) {
            Write-Host "installer touched, packaging this run:`n  $($hits -join "`n  ")"
            'PACKAGE=true' | Out-File $env:GITHUB_ENV -Append
          } else {
            Write-Host 'no installer changes in this pull request; package steps stay off'
          }

      # rust-toolchain.toml is the single source of truth for the compiler
      # version. The action needs it as an argument (it cannot read the file,
      # and a SHA-pinned action has no ref to infer one from), so the version
      # is read out of the file rather than written down a second time: the
      # two used to be able to drift, and rustup would then install the
      # components for one toolchain while cargo used the other.
      - name: Read the toolchain version
        shell: pwsh
        run: |
          $line = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw 'no channel in rust-toolchain.toml' }
          $v = $line.Matches.Groups[1].Value
          Write-Host "toolchain from rust-toolchain.toml: $v"
          "RUST_TOOLCHAIN=$v" | Out-File $env:GITHUB_ENV -Append

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Only master runs write the cache (tag runs restore from it); save
          # even when tests fail so a red master still warms the next run.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      # For a tag build, the tag must match the workspace version the MSI is
      # stamped with — otherwise we'd publish e.g. v2.0.1 carrying a 2.0.0 MSI.
      # The landing page's JSON-LD carries the same version (its download
      # labels come from it), so it is checked too.
      - name: Verify tag matches Cargo.toml and the landing page
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -ne $tag) { throw "tag $tag != workspace version $ver" }
          $page = (Select-String -Path docs/index.html -Pattern '"softwareVersion":\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($page -ne $tag) { throw "docs/index.html softwareVersion $page != tag $tag (stamp it when bumping the version)" }
          Write-Host "tag, workspace version and landing page agree: $ver"

      - name: Format check
        run: cargo fmt --all --check

      # Licenses + RUSTSEC advisories across the whole dependency tree
      # (deny.toml). A prebuilt, checksum-verified binary (the official
      # cargo-deny action is a Linux container action and cannot run here).
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (licenses, advisories, sources)
        run: cargo deny check

      # The two installers are pinned by checksum, which makes them perfectly
      # cacheable: the key is the version and the hashes, so a cache entry can
      # only be reused for the exact bytes this run would have downloaded.
      # Every run used to pull ~300 MB before it could compile anything.
      - name: Cache the GStreamer installers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: gst-msi
          key: gst-${{ env.GST_VERSION }}-${{ env.GST_RUNTIME_SHA256 }}-${{ env.GST_DEVEL_SHA256 }}

      - name: Install GStreamer (runtime + devel), checksum-pinned
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          $dir = Join-Path $env:GITHUB_WORKSPACE "gst-msi"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $files = @(
            @{ Name = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi";       Sha = "$env:GST_RUNTIME_SHA256" },
            @{ Name = "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi"; Sha = "$env:GST_DEVEL_SHA256" }
          )
          foreach ($f in $files) {
            $path = Join-Path $dir $f.Name
            # A cached copy still has to match the pin before it is trusted;
            # anything else is downloaded again.
            if ((Test-Path $path) -and (Get-FileHash $path -Algorithm SHA256).Hash -eq $f.Sha) {
              Write-Host "$($f.Name): cached"
            } else {
              Remove-Item $path -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri "$base/$($f.Name)" -OutFile $path
            }
            $got = (Get-FileHash $path -Algorithm SHA256).Hash
            if ($got -ne $f.Sha) { throw "checksum mismatch for $($f.Name): got $got expected $($f.Sha)" }
            Start-Process msiexec -ArgumentList "/i", "`"$path`"", "/qn", "ADDLOCAL=ALL", "/norestart" -Wait -NoNewWindow
          }
          # The build env (PKG_CONFIG etc.) comes from .cargo/config.toml; add the
          # runtime bin to PATH so the harvest, the tests, and any run find it.
          "$env:GST_BIN" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Deterministic suites (no media, no GStreamer runtime) gate the release:
      # a failing tag push never ships. This is a single cargo invocation so its
      # exit code is the step's exit code.
      - name: Test (core + gui — gates the release)
        run: cargo test -p kuvatin-core -p kuvatin --release

      # Self-contained video tests: they generate their own frames under the
      # workspace's target dir and drive real GES/GStreamer pipelines (encode,
      # cancel mid-render, EXR conversion, size normalisation). Blocking. Must
      # be single-threaded: concurrent GES pipelines deadlock.
      - name: Test (video engine, self-contained — gates the release)
        shell: pwsh
        run: |
          $env:RUST_BACKTRACE = "1"
          cargo test -p kuvatin-video --release -- --test-threads=1 `
            sequence:: previews_and_renders_an_image_sequence transport_and_edits_are_inert_while_rendering `
            export_settings_normalize_size_and_fps trim_math_never_goes_negative `
            stale_end_of_stream set_clip_duration_sets_and_clamps_a_still sets_canvas_size `
            slid neighbour confined_to_the_gap already_overlapping discovery_gives_up `
            without_blocking_the_caller document:: survives_being_saved missing_source encoder

      # Fixtures for everything that needs real media. They live under the
      # workspace (a clean long path — the runner's %TEMP% is an 8.3 short path
      # GStreamer's URI opener can choke on) and are built by a blocking step:
      # if they cannot be made, the steps that depend on them are not measuring
      # anything.
      - name: Build the live-media fixtures
        shell: pwsh
        run: |
          $fixdir = Join-Path $env:GITHUB_WORKSPACE "target\test-fixtures"
          New-Item -ItemType Directory -Force -Path $fixdir | Out-Null
          $fx = Join-Path $fixdir "fixture_av.webm"
          $img = Join-Path $fixdir "fixture.png"
          # Forward slashes: gst-launch unescapes backslashes in property values.
          $fxl = $fx -replace "\\", "/"
          $imgl = $img -replace "\\", "/"
          gst-launch-1.0 -e videotestsrc num-buffers=150 ! "video/x-raw,width=320,height=180" ! vp8enc ! webmmux name=m ! filesink location="$fxl" audiotestsrc num-buffers=300 ! audioconvert ! vorbisenc ! m.
          gst-launch-1.0 videotestsrc num-buffers=1 ! "video/x-raw,width=320,height=180" ! pngenc ! filesink location="$imgl"
          if (-not (Test-Path $fx) -or (Get-Item $fx).Length -eq 0) { throw "fixture webm not created at $fx" }
          if (-not (Test-Path $img) -or (Get-Item $img).Length -eq 0) { throw "fixture png not created at $img" }
          "GST_TEST_FILE=$fx" | Out-File $env:GITHUB_ENV -Append
          "GST_TEST_IMAGE=$img" | Out-File $env:GITHUB_ENV -Append

      # Two regressions that only real media can catch, and both shipped once:
      # an export that came back instantly as a zero-byte file (a stale
      # end-of-stream from the preview was read as the render's result), and a
      # gapped overlay timeline that rendered something no player would open.
      # They used to sit inside the advisory step, where a failure was a line
      # in a log nobody reads. One retry before it counts, because asset-URI
      # resolution on the hosted runner is occasionally flaky — a second
      # failure in a row is the code, not the runner.
      - name: Test (export regressions, live media — gates the release)
        shell: pwsh
        run: |
          $env:RUST_BACKTRACE = "1"
          $names = @("renders_after_preview_eos", "renders_gapped_overlay_timeline")
          foreach ($attempt in 1..2) {
            cargo test -p kuvatin-video --release -- --test-threads=1 --exact `
              project::tests::renders_after_preview_eos `
              project::tests::renders_gapped_overlay_timeline
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 2) { throw "the export regressions failed twice: $($names -join ', ')" }
            Write-Host "::warning::live-media export regressions failed once; retrying"
          }

      # The rest of the live-media suite is environment-sensitive on the hosted
      # runner, so it runs for signal but does NOT block.
      - name: Test (video integration — advisory, live media)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:RUST_BACKTRACE = "1"
          cargo test -p kuvatin-video --release -- --test-threads=1

      # The headline export path, end to end, with the shipped binary: generate
      # 48 PNG frames, render them to H.264 MP4 through the real right-click
      # entry point (--sequence-mp4, --quiet = no window), and discover the
      # result. Blocking.
      - name: Smoke render with the release exe (gates the release)
        shell: pwsh
        run: |
          cargo build --release -p kuvatin -p kuvatin-shellext
          $frames = Join-Path $env:GITHUB_WORKSPACE "target\smoke\frames"
          New-Item -ItemType Directory -Force -Path $frames | Out-Null
          # gst-launch unescapes backslashes in property values (C:\x -> C:x), so
          # locations use forward slashes.
          $loc = ($frames -replace "\\", "/") + "/frame_%04d.png"
          gst-launch-1.0 videotestsrc num-buffers=48 ! "video/x-raw,width=320,height=180" ! pngenc ! multifilesink location="$loc"
          $first = Join-Path $frames "frame_0000.png"
          if (-not (Test-Path $first)) { throw "frames not generated" }
          $p = Start-Process -FilePath "target\release\kuvatin.exe" -ArgumentList "--sequence-mp4","--fps","24","--quiet","`"$first`"" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "kuvatin --sequence-mp4 exited $($p.ExitCode)" }
          $mp4 = Join-Path $frames "frame.mp4"
          if (-not (Test-Path $mp4) -or (Get-Item $mp4).Length -lt 10KB) { throw "smoke render produced no usable MP4" }
          $info = & gst-discoverer-1.0 $mp4 2>&1 | Out-String
          if ($info -notmatch "H\.264") { Write-Host $info; throw "smoke render is not H.264" }
          Write-Host "smoke render OK: $((Get-Item $mp4).Length) bytes"

      # ---- MSI: tag pushes and manual dispatch only (master runs stop here) ----
      # cargo-wix is a source install, and the build cache is written only by
      # master runs, which never package — so every tag paid the full compile.
      # This cache is keyed on the exact version and holds just the binary.
      - name: Cache cargo-wix
        if: env.PACKAGE == 'true'
        id: wix-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\.cargo\bin\cargo-wix.exe
          key: cargo-wix-0.3.9-${{ runner.os }}

      - name: Install cargo-wix
        if: env.PACKAGE == 'true' && steps.wix-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Install WiX Toolset v3 (no-admin binaries), checksum-pinned
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $dest = "$env:USERPROFILE\wix3-bin"
          $zip = "$env:TEMP\wix314-binaries.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($got -ne "$env:WIX_ZIP_SHA256") { throw "checksum mismatch for wix314-binaries.zip: got $got expected $env:WIX_ZIP_SHA256" }
          Expand-Archive $zip -DestinationPath $dest -Force
          "$dest" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI (trimmed GStreamer runtime + third-party licenses)
        if: env.PACKAGE == 'true'
        shell: pwsh
        env:
          # Optional: a code-signing PFX (base64) + its password. Signs the
          # Windows 11 context-menu package; see README, "Signing the menu package".
          SIGN_PFX_BASE64: ${{ secrets.KUVATIN_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.KUVATIN_SIGN_PFX_PASSWORD }}
        run: |
          # The bundle script walks kuvatin.exe's imports to compute the DLL
          # closure; the release binary exists from the smoke step.
          $stage = "$env:GITHUB_WORKSPACE\target\gst-staging"
          # The runtime's SBOM goes outside the workspace: the SBOM scan below
          # reads any SBOM-named file it finds, and would add these files twice.
          & crates\kuvatin\wix\bundle-gstreamer.ps1 -StageDir $stage -HeatExe "$env:USERPROFILE\wix3-bin\heat.exe" `
            -SbomOut "$env:RUNNER_TEMP\gstreamer-runtime.cdx.json" -DistributionSha256 "$env:GST_RUNTIME_SHA256"
          # The Windows 11 context-menu package (identity for the install dir;
          # the handler DLL is built with the exe above). Version = Cargo.toml.
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          "KUVATIN_VERSION=$ver" | Out-File $env:GITHUB_ENV -Append
          $msix = "$env:GITHUB_WORKSPACE\target\msix\Kuvatin.msix"
          # Windows refuses an unsigned package that hosts a COM server, so the
          # package is signed when the repo has a key; its Publisher must equal
          # the certificate's Subject. The public certificate rides along in
          # the MSI, which trusts it machine-wide before registering. Without a
          # key the package ships unsigned: the exe logs that it could not
          # register and the classic menu is unaffected.
          $cer = ''
          if ($env:SIGN_PFX_BASE64) {
            $pfx = "$env:RUNNER_TEMP\kuvatin-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:SIGN_PFX_PASSWORD)
            & crates\kuvatin\msix\build-msix.ps1 -Version $ver -Out $msix -Publisher $cert.Subject
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { [version]($_.Directory.Parent.Name) } | Select-Object -Last 1
            try {
              # /tr countersigns with a trusted time. Without it the signature
              # dies with the certificate, and every installer already shipped
              # would stop registering the menu on that day.
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_PFX_PASSWORD $msix
              if ($LASTEXITCODE -ne 0) { throw "signtool exited $LASTEXITCODE" }
            } finally {
              # Never leave the decoded private key on the runner, not even
              # when signing threw.
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            }
            $cer = "$env:GITHUB_WORKSPACE\target\msix\kuvatin-signing.cer"
            Export-Certificate -Cert $cert -FilePath $cer | Out-Null
            $thumb = $cert.Thumbprint
            Write-Host "package signed as $($cert.Subject) ($thumb)"
            'SIGNED=true' | Out-File $env:GITHUB_ENV -Append
          } else {
            & crates\kuvatin\msix\build-msix.ps1 -Version $ver -Out $msix
            Write-Host '::warning::No signing key (KUVATIN_SIGN_PFX_BASE64): Kuvatin.msix ships unsigned, so the Windows 11 top-level menu will not register.'
            'SIGNED=false' | Out-File $env:GITHUB_ENV -Append
          }
          cd crates\kuvatin
          # Two explicit command lines: splatting an argument array into a
          # native command silently dropped the signing variables under pwsh,
          # and the installer shipped without the certificate.
          if ($cer) {
            Write-Host "cargo wix with GstStageDir, MsixPath, SignCerPath=$cer, SignCerThumbprint=$thumb"
            cargo wix -p kuvatin --nocapture --compiler-arg "-dGstStageDir=$stage" --compiler-arg "-dMsixPath=$msix" --compiler-arg "-dSignCerPath=$cer" --compiler-arg "-dSignCerThumbprint=$thumb"
          } else {
            Write-Host 'cargo wix with GstStageDir, MsixPath (unsigned package)'
            cargo wix -p kuvatin --nocapture --compiler-arg "-dGstStageDir=$stage" --compiler-arg "-dMsixPath=$msix"
          }
          cd ..\..
          # A fixed-name copy so the landing page can link the latest release
          # statically, and a checksum file for the (unsigned) installer.
          $msi = Get-ChildItem target\wix\kuvatin-*-x86_64.msi | Select-Object -First 1
          Copy-Item $msi.FullName (Join-Path $msi.DirectoryName "kuvatin-x86_64.msi")
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          # LF, not Out-File's CRLF: `sha256sum -c` (Git Bash, Linux) rejects a CR in the name.
          [IO.File]::WriteAllText("$($msi.FullName).sha256", "$hash  $($msi.Name)`n")
          # The landing page links the fixed-name copy, whose checksum file has
          # to name *that* file or `sha256sum -c` fails on the filename even
          # though the bytes match.
          [IO.File]::WriteAllText(
            (Join-Path $msi.DirectoryName "kuvatin-x86_64.msi.sha256"),
            "$hash  kuvatin-x86_64.msi`n")
          Get-ChildItem target\wix

      # Install the MSI the way a user would and drive the INSTALLED exe with
      # the runner's GStreamer hidden from PATH: only the bundled runtime may
      # satisfy it. A plugin missing from the allow-list fails here.
      - name: Install test (installed exe converts and renders)
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target\wix\kuvatin-*-x86_64.msi | Select-Object -First 1).FullName
          $log = "$env:TEMP\kuvatin-install.log"
          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/norestart","/l*v","`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log | Select-Object -Last 80; throw "msiexec /i exited $($p.ExitCode)" }
          $exe = "C:\Program Files\kuvatin\bin\kuvatin.exe"
          if (-not (Test-Path $exe)) { throw "installed exe missing at $exe" }
          # The Start menu component is keyed on a per-user registry value
          # (ICE38/ICE43 allow nothing else for a shortcut in ProgramMenuFolder),
          # while the package itself is per-machine. Nothing used to check that
          # the shortcut arrives in the all-users menu, or that it leaves again.
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Kuvatin'
          if (-not (Test-Path (Join-Path $startMenu 'Kuvatin.lnk'))) {
            throw "install did not create the all-users Start menu shortcut in $startMenu"
          }
          # --register ran as a deferred, impersonated custom action: the Explorer
          # verb must now exist in THIS user's hive and point at the installed exe.
          $verb = 'HKCU:\Software\Classes\SystemFileAssociations\.png\shell\Kuvatin'
          if (-not (Test-Path $verb)) {
            Get-Content $log | Select-String 'KuvatinRegister' | Select-Object -Last 6
            throw "install did not register the Explorer verb ($verb missing)"
          }
          $icon = (Get-ItemProperty $verb).Icon
          if ($icon -ne $exe) { throw "Explorer verb points at '$icon', expected '$exe'" }
          # Windows 11 top-level menu: the sparse package must be registered for
          # this user with the install dir as its external location. Windows 10
          # (build < 22000) has neither the menu nor unsigned-package support.
          $build = [int](Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber
          Get-Content "$env:LOCALAPPDATA\Kuvatin\kuvatin.log" -ErrorAction SilentlyContinue | Select-String 'Windows 11 menu' | Select-Object -Last 1
          if ($build -ge 22000 -and $env:SIGNED -eq 'true') {
            if (-not (Test-Path 'C:\Program Files\kuvatin\bin\kuvatin-signing.cer')) { throw 'signed build, but the installer did not ship kuvatin-signing.cer (SignCerPath not passed to WiX?)' }
            $pkg = Get-AppxPackage VilleMattila.Kuvatin
            if (-not $pkg) {
              Write-Host '--- Trusted People (machine):'
              Get-ChildItem Cert:\LocalMachine\TrustedPeople | ForEach-Object { "  $($_.Subject) $($_.Thumbprint)" }
              Write-Host '--- installer log, certificate + register actions:'
              Get-Content $log | Select-String 'KuvatinTrustCert|KuvatinRegister|certutil' | ForEach-Object { $_.Line } | Select-Object -Last 12
              throw "signed sparse package not registered on build $build"
            }
            Write-Host "sparse package registered: $($pkg.PackageFullName) ($($pkg.SignatureKind))"
          } else {
            Write-Host "build $build, signed=$env:SIGNED: package registration not required here"
          }
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -notlike '*gstreamer*' }) -join ';'
          $work = Join-Path $env:GITHUB_WORKSPACE "target\smoke\installed"
          New-Item -ItemType Directory -Force -Path "$work\frames" | Out-Null
          Copy-Item "target\smoke\frames\frame_*.png" "$work\frames"
          # 1) a preset conversion (image pipeline)
          Copy-Item "$work\frames\frame_0000.png" "$work\photo.png"
          # Start-Process joins the list with spaces and does NOT quote, so the
          # preset name must carry its own quotes (it arrived as `Convert`).
          $p = Start-Process -FilePath $exe -ArgumentList "--preset","`"Convert to WebP`"","--quiet","`"$work\photo.png`"" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "installed --preset exited $($p.ExitCode)" }
          $webp = Get-ChildItem "$work\*.webp" | Select-Object -First 1
          if (-not $webp -or $webp.Length -lt 100) { throw "installed exe produced no WebP" }
          # 2) a sequence render (video engine, bundled encoder)
          $p = Start-Process -FilePath $exe -ArgumentList "--sequence-mp4","--fps","24","--quiet","`"$work\frames\frame_0000.png`"" -Wait -NoNewWindow -PassThru
          if ($p.ExitCode -ne 0) { throw "installed --sequence-mp4 exited $($p.ExitCode)" }
          $mp4 = "$work\frames\frame.mp4"
          if (-not (Test-Path $mp4) -or (Get-Item $mp4).Length -lt 10KB) { throw "installed exe produced no usable MP4" }
          Write-Host "installed exe OK: $($webp.Name) ($($webp.Length) B), frame.mp4 ($((Get-Item $mp4).Length) B)"
          $p = Start-Process msiexec -ArgumentList "/x","`"$msi`"","/qn","/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
          if (Test-Path $verb) { throw "uninstall left the Explorer verb behind" }
          if (Test-Path $startMenu) { throw "uninstall left the Start menu folder behind" }
          if ($build -ge 22000 -and (Get-AppxPackage VilleMattila.Kuvatin)) { throw "uninstall left the sparse package registered" }
          if ($env:SIGNED -eq 'true' -and (Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object { $_.Subject -like 'CN=Ville Mattila*' })) { throw "uninstall left the signing certificate in Trusted People" }

      # Software bill of materials for the release (CycloneDX). The scan knows
      # the Rust crates; the step after it adds the bundled GStreamer runtime.
      # Only when packaging: it runs after a release build, so on an ordinary
      # push it would walk the staged GStreamer runtime and the MSI for
      # nothing. The name is taken from the version rather than the ref, which
      # on a pull request is "123/merge" and puts a slash in the path.
      - name: SBOM (CycloneDX)
        if: env.PACKAGE == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: target/kuvatin-v${{ env.KUVATIN_VERSION }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Most of what the installer redistributes is the GStreamer runtime, and
      # the staging script wrote down exactly which files of it ship.
      - name: Add the bundled runtime to the SBOM
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          & crates\kuvatin\wix\merge-sbom.ps1 `
            -Sbom "target\kuvatin-v$env:KUVATIN_VERSION-sbom.cdx.json" `
            -Add "$env:RUNNER_TEMP\gstreamer-runtime.cdx.json"

      - name: Collect release files
        if: env.PACKAGE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\wix\*.msi dist
          Copy-Item target\wix\*.sha256 dist
          Copy-Item target\kuvatin-*-sbom.cdx.json dist
          Get-ChildItem dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.PACKAGE == 'true'
        with:
          name: kuvatin-windows-msi
          path: dist/*

  # The only job that may write to the repository: it attaches the files the
  # build job produced to the release for the tag. Nothing here compiles or
  # executes third-party code.
  publish:
    name: Publish release assets
    needs: build
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kuvatin-windows-msi
          path: dist

      # The release used to be published with an empty body and the notes
      # pasted in by hand afterwards, so for a few minutes a release existed
      # with nothing describing it. The notes come from the changelog instead,
      # and a tag whose version has no section there fails here rather than
      # publishing something blank.
      - name: Release notes from the changelog
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v want="## [$ver]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $ver - write it before tagging" >&2
            exit 1
          fi
          echo "release notes for $ver:"
          cat release-notes.md

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
