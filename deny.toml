# cargo-deny configuration: license compliance + security advisories for the
# Rust dependency tree. Run `cargo deny check` (licenses, advisories, bans,
# sources). Kuvatin is GPL-3.0-or-later, so GPL-compatible licenses are fine;
# anything not listed below fails the check and must be reviewed.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Fail on unmaintained crates only when they are DIRECT dependencies. Note
# what this does to the rest: a transitive unmaintained crate is not demoted
# to a warning, it is not considered at all, so the unmaintained crates in
# Slint's text stack (paste, rustybuzz, ttf-parser) produce no output here.
# They are Slint's to replace; RUSTSEC advisories against them still fail,
# because those are a different check.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    # GPL-family: Kuvatin itself is GPL-3.0-or-later.
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
]
# Crates whose license expressions cargo-deny can't resolve from metadata.
exceptions = []

[licenses.private]
ignore = true

# Duplicate versions of the same crate used to be a warning, which is a line
# in a log nobody reads: twenty-eight of them passed silently. They are now an
# error, with the ones that are not ours to fix listed below — so a NEW
# duplicate, introduced by a dependency bump of ours, fails the check instead
# of joining the pile.
#
# What was ours: `toml` and `thiserror` were pinned a major behind the rest of
# the tree and now match it, which removed seven of the twenty-eight.
#
# What is left, and why:
#
#   windows-*  We bind Win32 through `windows` 0.58; Slint's winit backend
#              pulls 0.61 and 0.62. Moving up is a port of every `unsafe` call
#              in the shell integration and the COM context-menu handler, not
#              a version bump, and the handler runs inside explorer.exe — so
#              it happens deliberately, with a real install test, or not at all.
#
#   bitflags, hashbrown, png, read-fonts, rustc-hash, skrifa, smol_str
#              Slint's font and graphics stack against ours. Nothing in this
#              workspace chooses either version.
[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
skip = [
    { crate = "windows" },
    { crate = "windows-collections" },
    { crate = "windows-core" },
    { crate = "windows-future" },
    { crate = "windows-implement" },
    { crate = "windows-interface" },
    { crate = "windows-link" },
    { crate = "windows-numerics" },
    { crate = "windows-result" },
    { crate = "windows-strings" },
    { crate = "windows-sys" },
    { crate = "windows-targets" },
    { crate = "windows-threading" },
    { crate = "windows_x86_64_msvc" },
    { crate = "bitflags" },
    { crate = "hashbrown" },
    { crate = "png" },
    { crate = "read-fonts" },
    { crate = "rustc-hash" },
    { crate = "skrifa" },
    { crate = "smol_str" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
