[workspace]
resolver = "2"
members = ["crates/kuvatin-core", "crates/kuvatin", "crates/kuvatin-video"]

[workspace.package]
version = "2.8.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Ville-Mattila/Kuvatin"
homepage = "https://ville-mattila.github.io/Kuvatin/"
authors = ["Ville Mattila <ville.mattila@ensemble.fi>"]

[workspace.dependencies]
image = "0.25"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
thiserror = "1"
anyhow = "1"
directories = "5"
clap = { version = "4", features = ["derive"] }
